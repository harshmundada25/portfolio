<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Harsh Mundada Portfolio</title>

    <!-- SEO -->
    <meta
      name="description"
      content="Harsh Mundada - Computer Science Engineering student specializing in Full Stack Development, React.js, Node.js, and modern web technologies. Explore my projects and skills."
    />
    <meta
      name="keywords"
      content="Harsh Mundada, Full Stack Developer, React Developer, Java Developer, Web Developer, Computer Science, RCOEM Nagpur, Portfolio, Front-end Developer, Backend Developer"
    />
    <meta name="author" content="Harsh Mundada" />
    <meta name="robots" content="index, follow" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />

    <!-- Open Graph (LinkedIn, WhatsApp, Facebook) -->
    <meta property="og:title" content="Harsh Mundada | Full Stack Developer Portfolio" />
    <meta
      property="og:description"
      content="Computer Science Engineering student showcasing projects in Full Stack Development, React.js, Node.js, Machine Learning, and more."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://harshmundada.vercel.app" />
    <meta property="og:site_name" content="Harsh Mundada Portfolio" />
    <meta property="og:image" content="https://harshmundada.vercel.app/og-image.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Harsh Mundada | Full Stack Developer Portfolio" />
    <meta
      name="twitter:description"
      content="Computer Science Engineering student specializing in Full Stack Development and modern web technologies."
    />
    <meta name="twitter:image" content="https://harshmundada.vercel.app/twitter-image.jpg" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://harshmundada.vercel.app" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>

    <div id="root"></div>

    <!-- Vite entry point -->
    <script type="module" src="/src/main.jsx"></script>

</html>
